# Security headers of the site (nginx syntax). Used by the localhost preview (docker/nginx.conf). The public host (plan step 11) must send
# the same values: if that host cannot set headers, the Content-Security-Policy goes into a <meta> tag instead (docs/SECURITY.md).
# shortcut: this is the only copy for now; a converter for the public host's own format is added at step 10/11 (nothing is hosted yet).
#
# Content-Security-Policy: only this site's own files; no inline or remote scripts; workers from blob: (MapLibre starts
# its workers that way); images from data:/blob: (map textures); styles inline (MapLibre sets element styles).
# 'wasm-unsafe-eval' and child-src were removed after the library choice (MapLibre needs neither; checked in a real browser).
# When place search through an online geocoder is added (step 8) its one host is added to connect-src here and nowhere else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
