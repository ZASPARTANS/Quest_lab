# Security headers of the site (nginx syntax). Used by the localhost preview (docker/nginx.conf). The public host, GitHub Pages, sends no headers except
# HSTS (D42), so backend/pages.py reads the Content-Security-Policy and the referrer policy from this file and writes them into <meta> tags of the page
# (docs/SECURITY.md S14); this file stays the only copy of the values. (This comment first said a converter was still to come: corrected 2026-11-08.)
#
# Content-Security-Policy: only this site's own files; no inline or remote scripts; workers from blob: (MapLibre starts
# its workers that way); images from data:/blob: (map textures); styles inline (MapLibre sets element styles).
# 'wasm-unsafe-eval' and child-src were removed after the library choice (MapLibre needs neither; checked in a real browser).
# Two outside hosts, both in connect-src and nowhere else: the place-search geocoder (step 8, D27) and the reverse geocoder that names the device position (D32).
# Their origins must equal the origins of "geocoder.url" and "reverse_geocoder.url" in config/frontend.json (tests/hygiene/test_config_consistency.py checks this).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob: https://geocoding-api.open-meteo.com https://api-bdc.io; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
