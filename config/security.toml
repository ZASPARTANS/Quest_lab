# Settings for the repository secret scan (tests/hygiene/test_no_secrets.py). No code here.
# Each pattern is a regular expression for one well-known key format. A match fails the Docker tests.
# Decision D15, findings S05 and S07 in docs/SECURITY.md.

[patterns]
aws_access_key      = 'AKIA[0-9A-Z]{16}'
github_token        = 'gh[oprs]_[A-Za-z0-9]{30,}'
github_fine_grained = 'github_pat_[A-Za-z0-9_]{20,}'
huggingface_token   = 'hf_[A-Za-z0-9]{30,}'
openai_style_key    = 'sk-[A-Za-z0-9]{20,}'
slack_token         = 'xox[baprs]-[A-Za-z0-9-]{10,}'
google_api_key      = 'AIza[0-9A-Za-z_-]{30,}'
private_key_block   = '-----BEGIN [A-Z ]*PRIVATE KEY'
jwt                 = 'eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.'

[scan]
# Folders that are not part of the repository (ignored by git or not ours); everything else is scanned.
skip_dirs = [".git", ".venv", "data", "node_modules", "dist", ".claude", ".pytest_cache", "__pycache__"]
max_file_bytes = 1000000     # larger files are skipped (none expected in the repo)

[hashes]
# scripts/pin_hashes.py adds the sha256 of every published file of each pinned package to this file (finding S02).
requirements_file = "requirements.txt"                       # relative to the project folder
pypi_json_url = "https://pypi.org/pypi/{name}/{version}/json"  # PyPI's JSON API; lists every file of a release with its sha256
timeout_seconds = 30
