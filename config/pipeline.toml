# Settings for the data pipeline (fetch + process). No code here. Read with tomllib (Python 3.11).
# Facts behind these values: docs/DOMAIN.md. Decisions: docs/DECISIONS.md (D1, D4, D5).

[source]
# Name of a source in the ecmwf-opendata client's own URL table (it maps "ecmwf" to
# https://data.ecmwf.int/forecasts). Other names (aws, google, azure) are mirrors of the same data.
name = "ecmwf"
resolution = "0p25"          # 0.25 degree global grid
param = "tp"                 # total precipitation
type = "fc"                  # forecast
stream = "oper"
run_hours = [0, 12]          # UTC run hours used (06z/18z IFS runs are shorter, see DOMAIN.md)
max_retries = 3              # downloads: client default is 500 retries x 120 s, far too patient for this app
retry_after_seconds = 10
# Timeouts for every request (finding S01): without them a server that goes silent hangs the job for ever.
# connect = time to open the connection; read = longest silence while waiting for data (not the whole download).
connect_timeout_seconds = 10
read_timeout_seconds = 60
# Run search (one HEAD request per step file, about 120 per search): fail fast, because a server
# that is in trouble would otherwise make every one of those requests wait. See docs/ERRORS.md E009.
search_max_retries = 2
search_retry_after_seconds = 5

# Forecast steps (hours after run time) to fetch per model.
# Each range is [start, stop] inclusive, every N hours. Step 0 is not fetched: accumulation starts at 0.
[models.ifs]
step_ranges = [
  { start = 3,   stop = 144, every = 3 },
  { start = 150, stop = 240, every = 6 },
]

[models.aifs-single]
step_ranges = [
  { start = 6, stop = 360, every = 6 },
]

[paths]
raw_dir = "data/raw"         # ignored by git; layout: <raw_dir>/<YYYYMMDDHH>/<model>/tp.grib2
processed_dir = "data/processed"  # ignored by git; layout: <processed_dir>/<run folder>/ (see pipeline/processed.py)
run_folder_format = "%Y%m%d%H"    # name of the folder of one run (UTC run time) under both folders above
raw_file = "tp.grib2"             # downloaded file: <raw_dir>/<run folder>/<model>/<raw_file>
partial_suffix = ".part"          # a file or folder is built under this extra ending and renamed when complete
model_file = "{model}.npy"        # processed file of one model: <processed_dir>/<run folder>/<model_file>
agreement_file = "agreement.npy"  # processed IFS-vs-AIFS agreement field, same folder
meta_file = "meta.json"           # description of the processed run, same folder
validation_points_file = "config/validation_points.toml"  # places checked by scripts/validate_points.py (relative to the project folder)
frontend_config_file = "config/frontend.json"  # settings of the front end; scripts that draw frames read the colour scale from it
backend_config_file = "config/backend.toml"  # settings of the static data export (backend/)
site_dir = "data/site"            # ignored by git; the exported static site data (tiles, frames, manifest). frontend.json dev_data_dir must be the same folder

# Grid every GRIB message must have (checked by pipeline/grid.py; verified on real files 2026-11-06,
# docs/DOMAIN.md). Row 0 is the north edge, column 0 is longitude lon_first = 180 (not 0).
[grid]
ni = 1440
nj = 721
step_degrees = 0.25
lat_first = 90.0
lon_first = 180.0

# Multiply the value of a GRIB message by this to get millimetres, chosen from the message's own `units`
# key. IFS writes metres, AIFS writes kg m**-2 (= mm) (docs/ERRORS.md E006). Any other unit stops the run.
[units_to_mm]
"m" = 1000.0
"kg m**-2" = 1.0

[process]
interval_hours = 6                 # common time axis: IFS 3 h data is used at its 6 h steps only
wet_threshold_mm = 0.5             # a 6 h interval is "wet" at or above this (decision D13)
quantise_mm = 0.1                  # stored as whole multiples of this in uint16 (max 6553.5 mm per interval)
agreement_models = ["ifs", "aifs-single"]   # compared where both have data (6-240 h)
