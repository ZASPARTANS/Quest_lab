# Settings for the static data export (backend/export.py). No code here. Decisions: D4 (global), D14 (6 h blocks), D24; plan PLAN-006 step 7.
# Where the site data folder and this file live is set in config/pipeline.toml [paths] (site_dir, backend_config_file).

[tiles]
# Point tiles: the 6 h series of every grid cell for both models (backend/tiles.py). Measured on the real 2026-11-06 12z run
# (docs/PROGRESS.md, step 7): 16 x 16 cells, layer-major, byte-shuffled, gzip level 9 = about 28 MB in 4140 files (largest 20 kB);
# the same data unshuffled was 32 MB, in 32 x 32 tiles 26 MB in 1035 files (but about 25 kB per fetch).
size = 16
byte_shuffle = true
folder = "tiles"
file = "{row}_{col}.bin.gz"                # plain tile row and column numbers (the browser fills them in), counted from the north-west corner

[frames]
# Colour map frames for the map view (backend/frames.py): one Web Mercator palette PNG per model and block, plus the agreement. D34, PLAN-008.
enabled = true
size = 1440                                 # pixels (D34: 720 was blocky when magnified); the plan is made from the tiles, not from these pictures
gradient_levels = 16                        # rain colours: a continuous gradient in log10(mm) quantised to this many steps (palette PNG, D34)
fade_levels = 16                            # steps of the soft edge where rain starts
fade_from_mm = 0.05                         # below this nothing is drawn; the edge rises to full colour at the first colour stop
max_latitude = 85.0511287798                # Web Mercator limit
folder = "frames"
file = "{kind}_{step}.png"                  # kind = a model name or "agreement"; step = forecast hour at the END of the block
agreement_opacity = 0.8

[frames.agreement_colours]
# Colour per agreement class (names as in meta.json "codes"); an empty string means transparent.
# ONE blue family (PLAN-012, user feedback: orange looked like heat): bright blue = both models say rain, dimmer blue of the same hue = only one model
# says rain. A test checks the same hue and a clear step in lightness; measured over the dark base map: bright 4.5 : 1, dim 2.1 : 1 against the land.
both_dry = ""
both_wet = "#5aa0ff"
disagree = "#2b5fa6"

[manifest]
file = "manifest.json"
format_version = 1

[status]
# status.json next to the manifest (decision D26): only whether the build worked, the forecast run and the build time. No log text, no paths, no environment.
file = "status.json"

[source]
# Provenance written into the manifest. Licence and terms page: docs/SOURCES.md. The attribution sentence is the one ECMWF's Terms of Use give for a
# SERVICE created with its data ("This service is based on data and products of the European Centre for Medium-Range Weather Forecasts (ECMWF)"),
# read on https://apps.ecmwf.int/datasets/licences/general/ on 2026-11-07 (step 13.1); a test keeps it word for word.
name = "ECMWF Open Data"
data_url = "https://data.ecmwf.int/forecasts"
licence = "CC BY 4.0"
terms_url = "https://www.ecmwf.int/en/forecasts/datasets/open-data"
attribution = "This service is based on data and products of the European Centre for Medium-Range Weather Forecasts (ECMWF)."
models = { ifs = "IFS HRES 0.25 degree, total precipitation", aifs-single = "AIFS Single 0.25 degree, total precipitation" }
