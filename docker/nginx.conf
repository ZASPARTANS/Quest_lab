# nginx for the "public-like" localhost site (decision D19): serves the production build and the forecast data folder, as a static host would.
# Runs as a normal user on port 8080 with a read-only file system (only /tmp is writable). The security headers are NOT written here:
# they come from config/headers.conf, the one place the public host's headers are also meant to come from.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }  # not in nginx's list; MapLibre's worker is a .mjs file and must be served as JavaScript (the public host must do the same)
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /srv/site;
    include /etc/nginx/headers.conf;
    # Caching (plan step 9.3, measured with frontend/tools/load_timing.mjs). nginx drops the server-level add_header lines in a location that
    # has its own add_header, so every location below includes the security headers again.
    # Files whose NAME changes with their content are cached for a year: the built /assets (hashed names) and the tiles and frames (the page
    # adds ?v=<export time> to their addresses). The page itself and the manifest are always re-checked (a small 304 when unchanged).
    location /assets/ { include /etc/nginx/headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /data/tiles/ { alias /srv/data/tiles/; include /etc/nginx/headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /data/frames/ { alias /srv/data/frames/; include /etc/nginx/headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /data/ { alias /srv/data/; include /etc/nginx/headers.conf; add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ =404; include /etc/nginx/headers.conf; add_header Cache-Control "no-cache" always; }
  }
}
