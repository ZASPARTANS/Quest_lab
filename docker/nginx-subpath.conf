# nginx for the "GitHub Pages-like" local test site (plan PLAN-013 step 13.2): the assembled public folder (data/pages/_site) served from a SUB-FOLDER,
# /Quest_lab/, with NO security headers and only the cache header Pages sends, so the page is tested the way the public host will serve it:
# the security policy must come from the <meta> tags inside index.html alone. Port 8081 inside the preview's network (the browser-check container shares it).
pid /tmp/nginx-subpath.pid;
worker_processes 1;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;
  client_body_temp_path /tmp/client_temp_sub;
  proxy_temp_path /tmp/proxy_temp_sub;
  fastcgi_temp_path /tmp/fastcgi_temp_sub;
  uwsgi_temp_path /tmp/uwsgi_temp_sub;
  scgi_temp_path /tmp/scgi_temp_sub;

  server {
    listen 8081;
    location = /Quest_lab { return 301 /Quest_lab/; }
    location /Quest_lab/ {
      alias /srv/pages/;
      index index.html;
      add_header Cache-Control "max-age=600" always;   # what GitHub Pages sends (to be confirmed on the real site, step 13.5)
    }
  }
}
