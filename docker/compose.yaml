# Docker services for the project (decisions D10, D11, D15, D19, D20). Run from the repo root:
#   docker compose -f docker/compose.yaml run --rm tests            official Python test run (no network, project read-only)
#   docker compose -f docker/compose.yaml run --rm fetch            download the newest complete IFS + AIFS run into data/raw
#   docker compose -f docker/compose.yaml run --rm process          process data/raw into data/processed (NO network)
#   docker compose -f docker/compose.yaml run --rm export           turn data/processed into the static site data in data/site (NO network)
#   docker compose -f docker/compose.yaml run --rm frontend-tests   Node tests of the front-end helper code (no network)
#   docker compose -f docker/compose.yaml run --rm frontend-build   build the web app into frontend/dist
#   docker compose -f docker/compose.yaml run --rm frontend-check   browser plan code on the real tiles vs the Python reference (scripts/plan_reference.py first)
#   docker compose -f docker/compose.yaml up -d preview             the "public-like" site on http://localhost:8080 (stop: ... down)
#   docker compose -f docker/compose.yaml run --rm screenshots      browser screenshots of the preview into docs/evidence (starts preview)
#   BROWSER_NAME=firefox docker compose -f docker/compose.yaml run --rm browser-checks   the plan page in a real browser engine (chromium, firefox, webkit)
# After changing frontend/package.json add --build to the first `run` so the image is rebuilt.
#
# Hardening shared by every service (finding S03 in docs/SECURITY.md): not root, no Linux capabilities,
# no privilege gain, read-only root filesystem (only /tmp is writable, in memory), the project is mounted read-only.
# On Linux set APP_UID / APP_GID to your own ids (`export APP_UID=$(id -u) APP_GID=$(id -g)`) and create data/
# yourself, so the files written to data/ belong to you; on Docker Desktop the defaults work.
# Data folder: the host folder is DATA_DIR (default ../data, the project's data folder). Inside the container it must
# be the first folder of the raw_dir / processed_dir paths in config/pipeline.toml ([paths], now "data"); if the config
# points somewhere else, writing fails loudly (the project mount is read-only) instead of going to the wrong place.
# Image pins (digests) are checked and recorded in docs/SOURCES.md; change them only together with that record.
x-security: &security
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-python: &python
  <<: *security
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: precip-forecast:local
  working_dir: /work
  environment:
    PYTHONDONTWRITEBYTECODE: "1"

services:
  tests:
    # Official test run. The project is mounted read-only, so a test can never change the repo,
    # and the container has no network, so a test that secretly needs the internet fails.
    <<: *python
    volumes:
      - ..:/work:ro
    network_mode: none
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

  fetch:
    # The only Python service with network access. Only data/ (git-ignored) is writable.
    <<: *python
    volumes:
      - ..:/work:ro
      - ${DATA_DIR:-../data}:/work/data
    command: ["python", "-m", "pipeline.fetch"]

  basemap:
    # The stored base map (plan PLAN-010): downloads the checked pmtiles tool, the fonts and sprites and a world extract of OpenStreetMap data.
    # Network access (like fetch); only data/ is writable. Commands: measure (the gate), lock-assets, fetch-assets (refreshes the fonts and sprites; the committed copy is
    # frontend/basemap_assets, installed offline by `install-assets`, which a build runs in the no-network `export` service), fetch-release, build:
    #   docker compose -f docker/compose.yaml run --rm basemap python -m pipeline.basemap measure
    <<: *python
    volumes:
      - ..:/work:ro
      - ${DATA_DIR:-../data}:/work/data
    command: ["python", "-u", "-m", "pipeline.basemap", "measure"]

  process:
    # Reads the downloaded files and writes data/processed. No network: it never needs one.
    <<: *python
    volumes:
      - ..:/work:ro
      - ${DATA_DIR:-../data}:/work/data
    network_mode: none
    command: ["python", "-m", "pipeline.processed"]

  export:
    # Turns the processed run into the static site data (tiles, frames, manifest) in data/site. No network: it never needs one.
    <<: *python
    volumes:
      - ..:/work:ro
      - ${DATA_DIR:-../data}:/work/data
    network_mode: none
    command: ["python", "-m", "backend.export"]

  frontend-build:
    # Builds the web app. No network. Only specific project folders are mounted (read-only): mounting the whole project would show the
    # host's Windows node_modules folder instead of the Linux one inside the image (/node_modules).
    <<: *security
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        BASE_IMAGE: node:22-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    image: precip-frontend:local
    working_dir: /work/frontend
    network_mode: none
    tmpfs:
      - /tmp
      - /node_modules/.vite-temp  # Vite writes its bundled config here, next to the nearest node_modules
    environment:
      HOME: /tmp
      VITE_CACHE_DIR: /tmp/vite
      FRONTEND_OUT_DIR: /dist
    volumes:
      - ../config:/work/config:ro
      - ../frontend/package.json:/work/frontend/package.json:ro
      - ../frontend/vite.config.js:/work/frontend/vite.config.js:ro
      - ../frontend/index.html:/work/frontend/index.html:ro
      - ../frontend/src:/work/frontend/src:ro
      - ${FRONTEND_DIST_DIR:-../frontend/dist}:/dist
    command: ["/node_modules/.bin/vite", "build"]

  frontend-tests:
    # Node tests of the front-end helper code (node --test). No network, read-only mounts of only what the tests need.
    <<: *security
    image: precip-frontend:local
    working_dir: /work
    network_mode: none
    environment:
      HOME: /tmp
    volumes:
      - ../config:/work/config:ro
      - ../frontend/src:/work/frontend/src:ro
      - ../frontend/index.html:/work/frontend/index.html:ro   # one test reads the page's fixed text (no "wet" or "dry", D41)
      - ../tests/frontend:/work/tests/frontend:ro
    command: ["node", "--test", "tests/frontend/*.test.mjs"]

  frontend-check:
    # Runs the browser plan code on the real exported tiles and compares it with the independent Python reference
    # (made first by: ... run --rm process python -m scripts.plan_reference). No network; the data folders are read-only.
    <<: *security
    image: precip-frontend:local
    working_dir: /work
    network_mode: none
    environment:
      HOME: /tmp
    volumes:
      - ../config:/work/config:ro
      - ../frontend/src:/work/frontend/src:ro
      - ../frontend/tools:/work/frontend/tools:ro
      - ${DATA_DIR:-../data}/site:/work/data/site:ro
      - ${DATA_DIR:-../data}/check:/work/data/check:ro
    command: ["node", "frontend/tools/plan_check.mjs"]

  preview:
    # The "public-like" site: the production build plus the forecast data, served by nginx the way a static host would,
    # with the security headers of config/headers.conf. Reachable from this computer only (127.0.0.1).
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"   # the sub-folder test site below (preview-subpath) shares this container's network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/headers.conf:/etc/nginx/headers.conf:ro
      - ${FRONTEND_DIST_DIR:-../frontend/dist}:/srv/site:ro
      - ${DATA_DIR:-../data}/site:/srv/data:ro
      - ${DATA_DIR:-../data}/basemap:/srv/basemap:ro  # the stored base map; the world extract is made by the `basemap` service (data/basemap/world.pmtiles)

  preview-subpath:
    # The "GitHub Pages-like" test site (PLAN-013 step 13.2): the assembled public folder served from /Quest_lab/ with NO security headers, on port 8081 of the
    # preview's network (so http://localhost:8081/Quest_lab/ from this computer and from the browser-check container). Build it first:
    #   (Windows Git Bash: first `export MSYS_NO_PATHCONV=1`, or it rewrites the paths that start with a slash)
    #   FRONTEND_DIST_DIR=../data/pages/dist docker compose -f docker/compose.yaml run --rm frontend-build /node_modules/.bin/vite build --base=/Quest_lab/
    #   docker compose -f docker/compose.yaml run --rm export python -m scripts.assemble_site
    #   docker compose -f docker/compose.yaml up -d --force-recreate preview preview-subpath
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
    network_mode: "service:preview"
    depends_on:
      - preview
    volumes:
      - ./nginx-subpath.conf:/etc/nginx/nginx.conf:ro
      - ${DATA_DIR:-../data}/pages/_site:/srv/pages:ro

  screenshots:
    # A real browser (Playwright image) opens the preview and saves screenshots plus a report of what the page loaded.
    # Chromium runs with its own sandbox off (--no-sandbox: the container is the sandbox) and only talks to the preview.
    <<: *security
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
      args:
        BASE_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    image: precip-playwright:local
    working_dir: /work/frontend
    shm_size: 1gb
    depends_on:
      - preview
    environment:
      HOME: /tmp
      SCREENSHOT_BASE_URL: http://preview:8080
      SCREENSHOT_OUT_DIR: /out
    volumes:
      - ../config:/work/config:ro
      - ../frontend/tools:/work/frontend/tools:ro
      - ../docs/evidence:/out
    command: ["node", "tools/screenshots.mjs"]

  browser-checks:
    # Step 8 done-check: the plan page in a real browser engine (BROWSER_NAME=chromium | firefox | webkit). It shares the preview's network, so
    # the site is http://localhost:8080 - a secure context for every engine, like the HTTPS public site. The geocoder is a MOCK unless
    # BROWSER_CHECK_REAL_SEARCH=1 (then one real request is sent to Open-Meteo, which needs the container to have internet).
    <<: *security
    image: precip-playwright:local
    working_dir: /work/frontend
    shm_size: 1gb
    network_mode: "service:preview"
    depends_on:
      - preview
    environment:
      HOME: /tmp
      SCREENSHOT_BASE_URL: http://localhost:8080
      SCREENSHOT_OUT_DIR: /out
      BROWSER_NAME: ${BROWSER_NAME:-chromium}
      BROWSER_CHECK_REAL_SEARCH: ${BROWSER_CHECK_REAL_SEARCH:-}
    volumes:
      - ../config:/work/config:ro
      - ../frontend/tools:/work/frontend/tools:ro
      - ../docs/evidence:/out
    command: ["node", "tools/browser_checks.mjs"]
