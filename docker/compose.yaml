# Docker services for the project (decisions D10, D11). Run from the repo root, for example:
#   docker compose -f docker/compose.yaml run --rm tests
#   docker compose -f docker/compose.yaml run --rm run                       (process the newest downloaded run)
#   docker compose -f docker/compose.yaml run --rm run python -m pipeline.fetch   (download a run)
# Node tests/build and the nginx preview are added in the plan steps that need them.
services:
  tests:
    # Official test run. The project is mounted read-only, so a test can never change the repo,
    # and the container has no network, so a test that secretly needs the internet fails.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: precip-forecast-tests:local
    working_dir: /work
    volumes:
      - ..:/work:ro
    network_mode: none
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]

  run:
    # Real data work (fetch, process). The code is read-only; only data/ (git-ignored) is writable;
    # the network is on because fetching needs it. Same image as `tests`.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: precip-forecast-tests:local
    working_dir: /work
    volumes:
      - ..:/work:ro
      - ../data:/work/data
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "pipeline.processed"]
