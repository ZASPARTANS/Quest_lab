# Build the forecast site and publish it on GitHub Pages (plan PLAN-013 step 13.3, decision D42).
# Every 6 hours (and on every push to main that changes more than notes, tests and check tools, and by hand): fetch the newest complete ECMWF IFS + AIFS run, process and export it, put it together with the page and
# the stored base map, deploy it, and then check the PUBLIC site with a smoke test. The page, the pipeline and the checks are the ones tested in Docker locally;
# this file only runs them in order. Rules kept by scripts/check_workflow.py (a test): only GitHub-owned actions, each pinned to a commit; least-privilege
# permissions (write access only in the deploy job); no secrets; no environment dump; no ${{ }} inside shell code.
name: Build and deploy the forecast site

on:
  schedule:
    # ECMWF's 00z and 12z runs appear about 7.5 hours after their time (07:45 and 19:45 UTC): 08:20 and 20:20 pick up a new run; 02:20 and 14:20 are retries.
    - cron: "20 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # A push that changes only the notes, the tests or the browser-check tools cannot change the site, so it does not rebuild or redeploy (the schedule and
    # "Run workflow" always do). scripts/check_workflow.py allows only these paths here: everything the build reads must stay out of this list.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tests/**"
      - "frontend/tools/**"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the site address (base path)
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare folders and user ids for the containers
        run: |
          mkdir -p data/pages/dist
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build the container images
        run: docker compose -f docker/compose.yaml build fetch frontend-build

      - name: Fetch the newest complete forecast run
        run: docker compose -f docker/compose.yaml run --rm fetch

      - name: Process the run and check it against the raw files
        run: |
          docker compose -f docker/compose.yaml run --rm process
          docker compose -f docker/compose.yaml run --rm process python -m scripts.validate_points

      - name: Export the site data and check it
        run: |
          docker compose -f docker/compose.yaml run --rm export
          docker compose -f docker/compose.yaml run --rm export python -m scripts.validate_site

      # The 190 MB base-map file is the same on every run: keep it in the cache and download it only when it is not there (PLAN-015, decision D45).
      # The cache is only a place to keep data: the next step checks the file by size and sha256 whether it came from the cache or not, so a wrong file is never used.
      # The key follows config/basemap.toml, where the release address, size and sha256 are: a new file makes a new key.
      - name: Restore the stored base map from the cache
        id: basemap_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/basemap/world.pmtiles
          key: basemap-world-${{ hashFiles('config/basemap.toml') }}

      - name: Get the stored base map (checked by size and sha256; downloaded only if the cache did not have it)
        run: docker compose -f docker/compose.yaml run --rm basemap python -u -m pipeline.basemap fetch-release

      - name: Keep the stored base map in the cache for the next run
        if: steps.basemap_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/basemap/world.pmtiles
          key: ${{ steps.basemap_cache.outputs.cache-primary-key }}

      - name: Install the fonts and sprites kept in this repository (every file checked against the lock file; no network)
        run: docker compose -f docker/compose.yaml run --rm export python -u -m pipeline.basemap install-assets

      - name: Build the page for the site's own base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FRONTEND_DIST_DIR: ../data/pages/dist
        run: docker compose -f docker/compose.yaml run --rm frontend-build /node_modules/.bin/vite build --base="$BASE_PATH/"

      - name: Put the site together (page, data, base map, security policy in the page)
        run: docker compose -f docker/compose.yaml run --rm export python -m scripts.assemble_site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: data/pages/_site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the public site (page, fresh forecast, status file, a tile, base map by range request)
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 scripts/smoke_site.py "$SITE_URL" --retries 8 --wait 20
